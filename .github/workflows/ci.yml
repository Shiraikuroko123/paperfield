name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r deploy/requirements.txt
      - name: Python tests
        run: python -B -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check src/paperfield/static/app.js
          node --check src/research_atlas/static/app.js

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/flowloom/package-lock.json
      - name: Install web dependencies
        run: |
          npm ci --prefix apps/flowloom
          python -m pip install -r content/courses/requirements-docs.txt
      - name: Test and build Flowloom
        run: |
          npm test --prefix apps/flowloom
          npm run build --prefix apps/flowloom
      - name: Validate course source
        run: python -m mkdocs build --clean --strict --config-file content/courses/mkdocs.yml --site-dir .build/course-validation

  container:
    needs: [test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f deploy/docker/Dockerfile -t paperfield:test .
      - name: Smoke test unified routes
        run: |
          docker run -d --name paperfield-test -p 8765:8765 -e PAPERFIELD_AUTO_REFRESH=0 paperfield:test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/api/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:8765/atlas/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/
          curl --fail http://127.0.0.1:8765/atlas/
          curl --fail --location http://127.0.0.1:8765/courses/
          curl --fail http://127.0.0.1:8765/flowloom/
      - name: Container logs
        if: always()
        run: docker logs paperfield-test || true
      - name: Stop container
        if: always()
        run: docker rm -f paperfield-test || true
