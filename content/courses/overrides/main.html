{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    (() => {
      const path = window.location.pathname;
      document.documentElement.dataset.course = path.includes("/embodied/")
        ? "embodied"
        : path.includes("/llm/")
          ? "llm"
          : "hub";
    })();
  </script>
{% endblock %}
