  <g transform="translate(118 574)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="0" y="0" fill="oklch(0.73 0.02 28)" font-size="15">学习闭环</text>
    <text x="0" y="42" fill="oklch(0.96 0.008 28)" font-size="20" font-weight="700">预测</text>
    <text x="96" y="42" fill="oklch(0.63 0.13 28)" font-size="20">→</text>
    <text x="142" y="42" fill="oklch(0.96 0.008 28)" font-size="20" font-weight="700">推导</text>
    <text x="238" y="42" fill="oklch(0.63 0.13 28)" font-size="20">→</text>
    <text x="284" y="42" fill="oklch(0.96 0.008 28)" font-size="20" font-weight="700">实现</text>
    <text x="380" y="42" fill="oklch(0.63 0.13 28)" font-size="20">→</text>
    <text x="426" y="42" fill="oklch(0.96 0.008 28)" font-size="20" font-weight="700">失效</text>
    <text x="522" y="42" fill="oklch(0.63 0.13 28)" font-size="20">→</text>
    <text x="568" y="42" fill="oklch(0.96 0.008 28)" font-size="20" font-weight="700">验收</text>
    <text x="0" y="84" fill="oklch(0.72 0.02 28)" font-size="16">每一章都必须留下公式、命令、日志、失败与结论边界</text>
  </g>
</svg>
