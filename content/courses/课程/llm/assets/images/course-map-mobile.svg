      <text x="22" y="34" fill="oklch(0.46 0.17 28)" font-size="20" font-weight="720">M0</text>
      <text x="88" y="34" fill="oklch(0.2 0.018 28)" font-size="19">导学与诊断</text>
      <text x="22" y="68" fill="oklch(0.43 0.018 28)" font-size="15">确定起点</text>
    </g>
    <g transform="translate(40 250)">
      <rect width="400" height="92" rx="8" fill="oklch(0.22 0.02 28)" stroke="oklch(0.36 0.035 28)"/>
      <text x="22" y="34" fill="oklch(0.72 0.15 28)" font-size="20" font-weight="720">M1</text>
      <text x="88" y="34" fill="oklch(0.96 0.008 28)" font-size="19">数学与 PyTorch</text>
      <text x="22" y="68" fill="oklch(0.75 0.018 28)" font-size="15">建立训练语言</text>
    </g>
    <g transform="translate(40 370)">
      <rect width="400" height="92" rx="8" fill="oklch(0.22 0.02 28)" stroke="oklch(0.36 0.035 28)"/>
      <text x="22" y="34" fill="oklch(0.72 0.15 28)" font-size="20" font-weight="720">M2</text>
      <text x="88" y="34" fill="oklch(0.96 0.008 28)" font-size="19">Transformer 与生成</text>
      <text x="22" y="68" fill="oklch(0.75 0.018 28)" font-size="15">读懂 token 流</text>
    </g>
    <g transform="translate(40 490)">
