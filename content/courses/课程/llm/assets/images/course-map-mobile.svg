  <g transform="translate(40 1110)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="0" y="0" fill="oklch(0.73 0.02 28)" font-size="14">学习闭环</text>
    <text x="0" y="38" fill="oklch(0.96 0.008 28)" font-size="17" font-weight="700">预测 → 推导 → 实现 → 失效 → 验收</text>
  </g>
