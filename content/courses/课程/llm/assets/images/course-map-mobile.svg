      <text x="88" y="34" fill="oklch(0.98 0.006 28)" font-size="19">对齐与 RL</text>
      <text x="22" y="68" fill="oklch(0.86 0.035 28)" font-size="15">Project 1-12</text>
    </g>
    <g transform="translate(40 730)">
