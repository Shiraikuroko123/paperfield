<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1190" role="img" aria-labelledby="course-map-mobile-title course-map-mobile-desc">
  <title id="course-map-mobile-title">LLM 系统课程移动端路径图</title>
  <desc id="course-map-mobile-desc">课程从 M0 到 M7 纵向排列，依次覆盖导学、数学、Transformer、预训练、对齐、前沿方法、训练系统和研究项目。</desc>
  <defs>
    <marker id="course-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="oklch(0.67 0.15 28)"/>
    </marker>
  </defs>

  <rect width="480" height="1190" fill="oklch(0.14 0.012 28)"/>
  <text x="36" y="52" fill="oklch(0.96 0.008 28)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="720">从 loss 到可复现系统</text>
  <text x="38" y="86" fill="oklch(0.75 0.018 28)" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15">M0-M7 · 35 个项目 · 7 个 CPU 实验</text>

  <g fill="none" stroke="oklch(0.67 0.15 28)" stroke-width="4" stroke-linecap="round" marker-end="url(#course-mobile-arrow)">
    <path d="M240 222 V244"/>
    <path d="M240 342 V364"/>
    <path d="M240 462 V484"/>
    <path d="M240 582 V604"/>
    <path d="M240 702 V724"/>
    <path d="M240 822 V844"/>
    <path d="M240 942 V964"/>
  </g>

