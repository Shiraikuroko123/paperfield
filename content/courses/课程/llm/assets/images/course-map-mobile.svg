      <text x="22" y="34" fill="oklch(0.72 0.15 28)" font-size="20" font-weight="720">M6</text>
      <text x="88" y="34" fill="oklch(0.96 0.008 28)" font-size="19">训练与推理系统</text>
      <text x="22" y="68" fill="oklch(0.75 0.018 28)" font-size="15">Project 20-35</text>
