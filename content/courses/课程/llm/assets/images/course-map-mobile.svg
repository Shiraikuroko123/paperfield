      <text x="88" y="34" fill="oklch(0.96 0.008 28)" font-size="19">数据、预训练与 SFT</text>
      <text x="22" y="68" fill="oklch(0.75 0.018 28)" font-size="15">形成基础能力</text>
    </g>
    <g transform="translate(40 610)">
