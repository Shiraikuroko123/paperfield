      <text x="22" y="34" fill="oklch(0.42 0.11 185)" font-size="20" font-weight="720">M7</text>
      <text x="88" y="34" fill="oklch(0.2 0.025 185)" font-size="19">评测、研究与项目</text>
      <text x="22" y="68" fill="oklch(0.4 0.04 185)" font-size="15">独立证据</text>
