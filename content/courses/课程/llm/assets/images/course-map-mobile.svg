      <text x="22" y="34" fill="oklch(0.8 0.1 185)" font-size="20" font-weight="720">M5</text>
      <text x="88" y="34" fill="oklch(0.97 0.012 185)" font-size="19">方法与前沿</text>
      <text x="22" y="68" fill="oklch(0.82 0.035 185)" font-size="15">Project 13-19</text>
    </g>
    <g transform="translate(40 850)">
