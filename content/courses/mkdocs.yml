site_name: AI 系统课程
site_description: 从 LLM 系统到具身智能的中文工程与研究课程
site_author: Shiraikuroko123
site_url: http://127.0.0.1:8765/courses/
repo_name: Shiraikuroko123/paperfield
repo_url: https://github.com/Shiraikuroko123/paperfield
edit_uri: edit/main/content/courses/课程/
docs_dir: 课程
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 学习中心: README.md
  - 具身智能课程:
      - 课程入口: embodied/README.md
      - M0 导学与诊断:
          - 导学、诊断与学习方法: embodied/00-导学与诊断/01-导学诊断与学习方法.md
          - 具身智能全景与核心术语: embodied/00-导学与诊断/02-具身智能全景与核心术语.md
      - M1 数学与学习基础:
          - 具身智能所需的数学基础: embodied/01-数学与学习基础/01-数学基础.md
          - Python、PyTorch 与深度学习: embodied/01-数学与学习基础/02-Python-PyTorch与深度学习.md
          - 视觉、Transformer 与生成模型: embodied/01-数学与学习基础/03-视觉-Transformer与生成模型.md
      - M2 机器人系统基础:
          - 坐标、位姿与运动学: embodied/02-机器人系统基础/01-坐标位姿与运动学.md
          - 动力学与机器人控制: embodied/02-机器人系统基础/02-动力学与机器人控制.md
          - 硬件、传感器与安全: embodied/02-机器人系统基础/03-硬件传感器与安全.md
          - 感知、状态估计、ROS2 与仿真: embodied/02-机器人系统基础/04-感知状态估计ROS2与仿真.md
      - M3 策略学习:
